name: Temporary Whisper Model Transfer

on:
  push:
    branches:
      - temp-whisper-model-20260806

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download multilingual Whisper models
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin \
            -o ggml-base-q5_1.bin
          curl -L --fail --retry 4 --retry-delay 2 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin \
            -o ggml-small-q5_1.bin
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin" | sha256sum -c -
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -

      - name: Upload base model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: ggml-base-q5_1.bin
          compression-level: 0
          retention-days: 1

      - name: Upload small model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
